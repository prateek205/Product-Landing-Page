<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="icons/favicon.png" type="image/x-icon" />
    <title>Product Landing Page</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="mainContainer">
      <!-- Navbar Section -->
      <div class="navbar">
        <h1 id="logo">mobile store</h1>
        <ul class="items">
          <li class="itemList">home</li>
          <li class="itemList">about</li>
          <li class="itemList">service</li>
          <li class="itemList">contact</li>
        </ul>
      </div>
      <!-- Hero Section -->
      <div class="heroContainer">
        <div class="heroContent">
          <h1 id="heroHeading">welcome to mobile world</h1>
          <p id="heroParagraph">
            Lorem, ipsum dolor sit amet consectetur adipisicing elit. Sapiente
            modi delectus beatae labore natus repellat atque! Molestiae nihil
            suscipit impedit, enim rem eligendi rerum maiores?
          </p>
        </div>
        <div class="heroImg">
          <img src="assets/mobile.png" alt="" />
        </div>
      </div>
      <!-- Category Section -->
       <div class="categoryContainer">
        <h1 id="categoryHeading">category</h1>
        <div class="categoryCard">
            <div class="categoryItems">
                <img src="assets/smartphone.jpg" alt="">
            </div>
        </div>
       </div>
    </div>
  </body>
</html>
